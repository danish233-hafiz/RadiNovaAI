{% extends 'base.html' %}
{% block content %}
<div class='d-flex justify-content-between align-items-center mb-4'>
<h2>Reports</h2>
</div>
<div class='card'><div class='card-body'>
<table class='table table-hover'>
<thead class='table-dark'><tr><th>Patient</th><th>Scan Type</th><th>Date</th><th>Action</th></tr></thead>
<tbody>
{% for report in reports %}
<tr>
<td>{{ report.scan.patient.full_name }}</td>
<td>{{ report.scan.scan_category }}</td>
<td>{{ report.created_at|date:'d M Y' }}</td>
<td><a href='/reports/{{ report.id }}/' class='btn btn-sm btn-info'>View</a></td>
</tr>
{% empty %}
<tr><td colspan='4' class='text-center'>No reports found</td></tr>
{% endfor %}
</tbody></table>
</div></div>
{% endblock %}
