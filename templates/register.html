<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadiNova AI - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{margin:0;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.brand-icon{background:linear-gradient(135deg,#1e3a5f,#2563eb);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;}
</style>
</head>
<body>
<div class="card bg-white">
<div class="text-center mb-4">
<div class="brand-icon"><i class="bi bi-activity text-white fs-3"></i></div>
<h3 class="fw-bold">RadiNova AI</h3>
<p class="text-muted">Create your account</p>
</div>
{% if messages %}
{% for message in messages %}
<div class="alert alert-danger py-2">{{ message }}</div>
{% endfor %}
{% endif %}
<form method="post">
{% csrf_token %}
<div class="mb-3">
<label class="form-label fw-semibold">Username</label>
<div class="input-group">
<span class="input-group-text"><i class="bi bi-person"></i></span>
<input type="text" name="username" class="form-control" placeholder="Choose username" required>
</div>
</div>
<div class="mb-3">
<label class="form-label fw-semibold">Password</label>
<div class="input-group">
<span class="input-group-text"><i class="bi bi-lock"></i></span>
<input type="password" name="password1" class="form-control" placeholder="Enter password" required>
</div>
</div>
<div class="mb-4">
<label class="form-label fw-semibold">Confirm Password</label>
<div class="input-group">
<span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
<input type="password" name="password2" class="form-control" placeholder="Confirm password" required>
</div>
</div>
<button type="submit" class="btn btn-primary w-100 fw-bold py-2">CREATE ACCOUNT</button>
</form>
<p class="text-center mt-3 mb-0">Already have an account? <a href="/login/" class="text-primary fw-semibold">Login</a></p>
</div>
</body>
</html>
