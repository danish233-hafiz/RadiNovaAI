{% extends 'base.html' %}
{% block content %}
<h2 class='mb-4'>Delete Scan</h2>
<div class='card' style='max-width:500px'><div class='card-body'>
<p>Are you sure you want to delete scan of <strong>{{ scan.patient.full_name }}</strong>?</p>
<p>Type: {{ scan.scan_category }} | Date: {{ scan.scan_date|date:'d M Y' }}</p>
<form method='post'>
{% csrf_token %}
<button type='submit' class='btn btn-danger'>Yes, Delete</button>
<a href='/radiology/' class='btn btn-secondary'>Cancel</a>
</form>
</div></div>
{% endblock %}
