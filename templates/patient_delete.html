{% extends 'base.html' %}
{% block content %}
<h2 class='mb-4'>Delete Patient</h2>
<div class='card' style='max-width:500px'><div class='card-body'>
<p>Are you sure you want to delete <strong>{{ patient.full_name }}</strong>?</p>
<form method='post'>
{% csrf_token %}
<button type='submit' class='btn btn-danger'>Yes, Delete</button>
<a href='/patients/' class='btn btn-secondary'>Cancel</a>
</form>
</div></div>
{% endblock %}
