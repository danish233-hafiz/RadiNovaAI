<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>RadiNova AI - Login</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css' rel='stylesheet'>
<style>
body{margin:0;padding:0;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:white;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.brand-icon{background:linear-gradient(135deg,#1e3a5f,#2563eb);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;}
.brand-icon i{color:white;font-size:2rem;}
.btn-login{background:linear-gradient(135deg,#1e3a5f,#2563eb);border:none;padding:12px;font-size:1rem;letter-spacing:1px;}
.btn-login:hover{background:linear-gradient(135deg,#2563eb,#1e3a5f);}
.form-control:focus{border-color:#2563eb;box-shadow:0 0 0 0.2rem rgba(37,99,235,0.25);}
</style>
</head>
<body>
<div class='login-card'>
<div class='text-center mb-4'>
<div class='brand-icon'><i class='bi bi-activity'></i></div>
<h3 class='fw-bold text-dark'>RadiNova AI</h3>
<p class='text-muted mb-0'>Radiology Management System</p>
</div>
{% if form.errors %}
<div class='alert alert-danger py-2'><i class='bi bi-exclamation-circle'></i> Invalid username or password</div>
{% endif %}
<form method='post'>
{% csrf_token %}
<div class='mb-3'>
<label class='form-label fw-semibold'>Username</label>
<div class='input-group'>
<span class='input-group-text'><i class='bi bi-person'></i></span>
<input type='text' name='username' class='form-control' placeholder='Enter username' required autofocus>
</div>
</div>
<div class='mb-4'>
<label class='form-label fw-semibold'>Password</label>
<div class='input-group'>
<span class='input-group-text'><i class='bi bi-lock'></i></span>
<input type='password' name='password' class='form-control' placeholder='Enter password' required>
</div>
</div>
<button type='submit' class='btn btn-login btn-primary w-100 text-white fw-bold'>LOGIN</button>
</form>
<p class='text-center text-muted mt-4 mb-0' style='font-size:0.85rem;'>RadiNova AI &copy; 2026</p>
</div>
</body>
</html>
