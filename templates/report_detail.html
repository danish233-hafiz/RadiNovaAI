{% extends 'base.html' %}
{% block content %}
<h2 class='mb-4'>Report Detail</h2>
<div class='card' style='max-width:700px'><div class='card-body'>
<p><strong>Patient:</strong> {{ report.scan.patient.full_name }}</p>
<p><strong>Scan Type:</strong> {{ report.scan.scan_category }}</p>
<p><strong>Date:</strong> {{ report.created_at|date:'d M Y' }}</p>
<hr>
<p><strong>Report:</strong></p>
<p>{{ report.report_text }}</p>
<a href='/reports/{{ report.id }}/pdf/' class='btn btn-danger'>Download PDF</a>
<a href='/reports/' class='btn btn-secondary'>Back</a>
</div></div>
<button onclick='window.print()' class='btn btn-success no-print mt-2'><i class='bi bi-printer'></i> Print Report</button>
{% endblock %}
