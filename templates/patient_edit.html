{% extends 'base.html' %}
{% block content %}
<h2 class='mb-4'>Edit Patient</h2>
<div class='card' style='max-width:600px'><div class='card-body'>
<form method='post'>
{% csrf_token %}
<div class='mb-3'><label class='form-label'>Full Name</label><input type='text' name='full_name' class='form-control' value='{{ patient.full_name }}' required></div>
<div class='mb-3'><label class='form-label'>Date of Birth</label><input type='date' name='date_of_birth' class='form-control' value='{{ patient.date_of_birth|date:"Y-m-d" }}' required></div>
<div class='mb-3'><label class='form-label'>Gender</label><select name='gender' class='form-control'>
<option {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
<option {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
<option {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
</select></div>
<div class='mb-3'><label class='form-label'>Contact Number</label><input type='text' name='contact_number' class='form-control' value='{{ patient.contact_number }}' required></div>
<div class='mb-3'><label class='form-label'>Medical History</label><textarea name='medical_history' class='form-control' rows='3'>{{ patient.medical_history }}</textarea></div>
<button type='submit' class='btn btn-warning'>Update Patient</button>
<a href='/patients/{{ patient.id }}/' class='btn btn-secondary'>Cancel</a>
</form></div></div>
{% endblock %}
